<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#4f46e5" />
<meta name="format-detection" content="telephone=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="轻课表" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>轻课表 · 今日课程</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f5fa; --card:#ffffff; --card2:#fafbff; --text:#171a21; --muted:#6b7280;
  --line:#e6e8f0; --line2:#d9dce9; --accent:#4f46e5; --accent-soft:#eef0ff;
  --ok:#10b981; --ok-soft:#e7f8f1; --warn:#f59e0b; --warn-soft:#fef4e3; --danger:#ef4444; --danger-soft:#fdeceb;
  --radius:16px; --shadow:0 1px 2px rgba(16,20,40,.04),0 8px 24px rgba(16,20,40,.06);
  --gutter:58px; --rowh:66px; --headh:48px;
}
html[data-theme="dark"]{
  --bg:#0e1016; --card:#171a22; --card2:#1c2029; --text:#e9ecf5; --muted:#9aa3b6;
  --line:#252a36; --line2:#333a49; --accent:#7c83ff; --accent-soft:#232842;
  --ok:#34d399; --ok-soft:#16302a; --warn:#fbbf24; --warn-soft:#33290f; --danger:#f87171; --danger-soft:#331a1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    --bg:#0e1016; --card:#171a22; --card2:#1c2029; --text:#e9ecf5; --muted:#9aa3b6;
    --line:#252a36; --line2:#333a49; --accent:#7c83ff; --accent-soft:#232842;
    --ok:#34d399; --ok-soft:#16302a; --warn:#fbbf24; --warn-soft:#33290f; --danger:#f87171; --danger-soft:#331a1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  }
}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; line-height:1.5;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
}
.sheet{max-height:92vh}
@supports (height: 100dvh){ .sheet{max-height:92dvh} .preview-wrap{max-height:46dvh} }
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
main.wrap{padding-bottom:104px}

/* ---------- 顶栏 ---------- */
header.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(10px)){header.top{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px)}}
.bar{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 4px 12px rgba(79,70,229,.32)}
.title{font-weight:750;font-size:16px;letter-spacing:.2px}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-right{display:flex;align-items:center;gap:8px}
.clock{font-variant-numeric:tabular-nums;font-weight:650;font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:10px}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.icon-btn:active{transform:scale(.95)}
@media(max-width:520px){.clock{display:none}}

/* ---------- 通用 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px}
.sec-title h2{font-size:15px;margin:0;font-weight:700;letter-spacing:.3px}
.sec-title .hint{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:11px;background:var(--card);border:1px solid var(--line2);font-size:14px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.28)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 9px}
.btn.ghost:hover{background:var(--card2);color:var(--text)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line2))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{padding:38px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty .big{font-size:38px;display:block;margin-bottom:8px;opacity:.75}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.mute{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.tiny{font-size:12px}

/* ---------- 今日 ---------- */
.hero{margin-top:16px;padding:18px 18px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--accent)}
.hero.live::after{background:var(--ok)}
.hero.none::after{background:var(--line2)}
.hero .h-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.hero .h-name{font-size:21px;font-weight:800;letter-spacing:.2px;line-height:1.25}
.hero .h-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}
.hero .h-time{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.progress{height:7px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:14px;border:1px solid var(--line)}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#34d399);transition:width .5s}
.day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px}
.day-head .d1{font-size:15px;font-weight:700}
.day-head .d2{font-size:12px;color:var(--muted)}

.tl{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.tl-item{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:stretch}
.tl-time{padding-top:12px;text-align:right;font-variant-numeric:tabular-nums}
.tl-time .t1{font-weight:750;font-size:14px}
.tl-time .t2{font-size:11px;color:var(--muted)}
.tl-card{position:relative;padding:12px 14px 12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.tl-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
.tl-card.past{opacity:.58}
.tl-card.now{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));box-shadow:0 0 0 2px var(--ok-soft),var(--shadow)}
.tl-card .c1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tl-card .cname{font-weight:750;font-size:15.5px}
.tl-card .cmeta{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--muted)}
.tl-card .cmeta b{font-weight:600;color:var(--text)}

/* ---------- 周课表 ---------- */
.weekbar{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.weekbar .wk{font-weight:750;font-size:15px;min-width:96px;text-align:center}
.grid-scroll{margin-top:12px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tt-inner{position:relative;min-width:calc(var(--gutter) + var(--days) * 96px)}
.tt{display:grid;grid-template-columns:var(--gutter) repeat(var(--days),minmax(0,1fr));position:relative}
.tt .gut{font-size:11px;color:var(--muted);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);gap:1px;padding:2px;position:sticky;left:0;z-index:6;background:var(--card)}
.tt .gut b{font-size:11.5px;color:var(--text);font-weight:650}
.tt .hd{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;font-weight:650;border-bottom:1px solid var(--line);border-right:1px solid var(--line);gap:1px;background:var(--card2);position:sticky;top:0;z-index:5}
.tt .hd:first-child{left:0;z-index:7}
.tt .hd small{font-weight:500;color:var(--muted);font-size:10.5px}
.tt .hd.today{background:var(--accent-soft);color:var(--accent)}
.tt .cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--card)}
.tt .cell.alt{background:var(--card2)}
.tt .cell.pick{cursor:cell}
.tt .cw{position:relative;padding:0}
.tt .c{position:absolute;border-radius:11px;padding:6px 7px;overflow:hidden;cursor:pointer;color:#fff;font-size:11.5px;line-height:1.28;box-shadow:0 2px 8px rgba(10,15,40,.16);border:1px solid rgba(255,255,255,.22)}
.tt .c:hover{filter:brightness(1.08)}
@media (hover:none){ .tt .c:hover{filter:none} }
.tt .c .n{font-weight:750;font-size:12px;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tt .c .m{opacity:.94;font-size:10.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tt .c .tag{position:absolute;right:5px;top:5px;background:rgba(255,255,255,.26);border-radius:6px;padding:0 4px;font-size:9.5px;font-weight:700}
.nowline{position:absolute;height:0;border-top:2px solid var(--danger);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:calc(var(--gutter) - 5px);top:-5px;width:9px;height:9px;border-radius:50%;background:var(--danger)}
.legend{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 单日视图（手机） ---------- */
.daystrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:56px;padding:7px 9px;border-radius:13px;background:var(--card);border:1px solid var(--line);text-align:center;line-height:1.3;box-shadow:var(--shadow)}
.dchip b{display:block;font-size:13.5px;font-weight:700}
.dchip span{font-size:10.5px;color:var(--muted)}
.dchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dchip.on span{color:rgba(255,255,255,.88)}
.dchip .dot2{display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:3px auto 0}
.dchip.on .dot2{background:#fff}
.dboard{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.drow{display:grid;grid-template-columns:52px 1fr;gap:9px;align-items:stretch}
.dgut{text-align:right;padding-top:8px;line-height:1.25}
.dgut b{display:block;font-size:12px;font-weight:650}
.dgut span{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dbody{border-radius:12px;border:1px dashed var(--line2);min-height:34px;display:flex;flex-direction:column;gap:6px;justify-content:center;padding:3px 8px;background:var(--card);touch-action:manipulation}
.dbody.free{color:var(--muted)}
.dbody.free::after{content:"＋";text-align:center;font-size:14px;opacity:.45}
.dbody.now{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.dbody.cont{border:none;background:transparent;min-height:14px;padding:0;position:relative}
.dbody.cont::before{content:"";position:absolute;left:5px;top:-6px;bottom:-6px;width:5px;border-radius:3px;background:var(--cc,var(--line2))}
.dcard{border-radius:10px;padding:9px 11px;color:#fff;position:relative;box-shadow:0 2px 8px rgba(10,15,40,.16);touch-action:manipulation}
.dcard .n{font-weight:750;font-size:14px;line-height:1.3}
.dcard .tm{font-size:12px;font-weight:650;margin-top:3px;opacity:.97;font-variant-numeric:tabular-nums}
.dcard .m{font-size:11.5px;opacity:.94;margin-top:2px}

/* ---------- 课程列表 ---------- */
.search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:13px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px;font-weight:800}
.stat span{font-size:11.5px;color:var(--muted)}
.daygroup{margin-top:16px}
.daygroup .gh{font-size:13px;font-weight:750;color:var(--muted);margin:0 0 8px 2px;display:flex;gap:8px;align-items:center}
.lrow{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:11px 13px;border-radius:13px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:8px}
.lrow .dot{width:6px;height:38px;border-radius:99px;background:var(--c)}
.lrow .ln{font-weight:700;font-size:14.5px}
.lrow .lm{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.lrow .acts{display:flex;gap:4px}
.linkbtn{color:var(--accent);font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:0 2px}
.wk[data-act]{cursor:pointer}
.wk[data-act]:active{color:var(--accent)}
mark{background:var(--warn-soft);color:inherit;border-radius:4px;padding:0 2px}

/* ---------- 设置 ---------- */
.set-card{padding:16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-top:12px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:none}
.field label{font-size:14px;font-weight:600}
.field .desc{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
input[type=date],input[type=time],input[type=number],input[type=text],select,textarea{
  background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;outline:none;font-size:14px;max-width:100%
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px}
.ptable td{padding:4px 6px;border-top:1px solid var(--line)}
.switch{position:relative;width:46px;height:27px;border-radius:99px;background:var(--line2);transition:.2s;flex:none}
.switch.on{background:var(--accent)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on::after{transform:translateX(19px)}

/* ---------- 底部导航 ---------- */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 20px rgba(10,15,40,.06)}
nav.tabbar .in{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabbar button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 9px;font-size:10.5px;color:var(--muted);font-weight:600}
nav.tabbar button .ic{font-size:19px;line-height:1.1}
nav.tabbar button.on{color:var(--accent)}

/* ---------- 弹层 ---------- */
#modal{display:none}
#modal.open{display:block}
.mask{position:fixed;inset:0;background:rgba(12,15,28,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .18s ease}
@media(min-width:760px){.mask{align-items:center;padding:24px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .22s cubic-bezier(.2,.8,.3,1)}
@media(min-width:760px){.sheet{border-radius:20px;max-height:88vh}}
.sheet.wide{max-width:940px}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .sh-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mrow.one{grid-template-columns:1fr}
.mrow label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.mrow input,.mrow select,.mrow textarea{width:100%}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;position:sticky;bottom:-18px;background:linear-gradient(180deg,transparent,var(--card) 34%);padding:14px 0 2px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.colors{display:flex;gap:7px;flex-wrap:wrap}
.colors i{width:26px;height:26px;border-radius:9px;cursor:pointer;border:2px solid transparent}
.colors i.on{border-color:var(--text);transform:scale(1.06)}
.preview-wrap{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:46vh}
table.prev{width:100%;border-collapse:collapse;font-size:12.5px;min-width:840px}
table.prev th{position:sticky;top:0;background:var(--card2);text-align:left;padding:7px 6px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);z-index:2}
table.prev td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.prev input[type=text],table.prev input[type=number]{width:100%;padding:5px 6px;border-radius:7px;font-size:12.5px;background:transparent;border-color:transparent}
table.prev input:hover{border-color:var(--line2)}
table.prev input:focus{background:var(--card2)}
table.prev tr.bad{background:var(--danger-soft)}
.tt-cell{font-size:11px;color:var(--muted);white-space:nowrap;padding-left:6px !important}
.note{padding:10px 12px;border-radius:11px;background:var(--card2);border:1px dashed var(--line2);font-size:12.5px;color:var(--muted);line-height:1.7}
.note code{background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:5px;font-size:11.5px}
textarea.drop{width:100%;min-height:132px;resize:vertical;line-height:1.6;font-size:13px}
textarea.drop.dragging{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:#1f2330;color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:86vw;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.mrow.three{grid-template-columns:1fr 1fr 1fr}
.hidden{display:none !important}

/* ---------- 手机端适配 ---------- */
@media(max-width:640px){
  :root{--gutter:46px;--rowh:56px;--headh:42px}
  .wrap{padding:0 12px}
  main.wrap{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  header.top{padding-top:env(safe-area-inset-top)}

<script>
/* =======================================================================
   轻课表 —— 本地课表应用（零依赖，单文件）
   功能：今日课程 / 周课表 / 课程检索管理 / 智能导入（JSON·表格·自由文本·矩阵） / 作息时间自定义
   数据保存在浏览器 localStorage，可导出导入 JSON。
   ======================================================================= */
(function(){
'use strict';

/* ------------------------------ 基础工具 ------------------------------ */
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
var DAYSHORT = ['一','二','三','四','五','六','日'];
var PALETTE = ['#4f46e5','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#0284c7','#65a30d','#db2777'];
var STORE_KEY = 'light-timetable-v1';

function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function uid(){ return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function toMin(t){ if(!t) return 0; var p=String(t).split(':'); return (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0); }
function fromMin(m){ m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+':'+pad(m%60); }
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDate(s){ var p=String(s||'').split('-'); var d=new Date(+p[0],(+p[1]||1)-1,+p[2]||1); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ var x=new Date(d.getTime()); var w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
function dayIndex(d){ return (d.getDay()+6)%7 + 1; }   /* 周一=1 … 周日=7 */
function mdText(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function cnDate(d){ return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
/* 把 8:00 / 8：00 之类的写法统一成 08:00，非法则返回 null */
function normalizeClock(s){
  var m = String(s==null?'':s).trim().match(/^(\d{1,2})\s*[:：]\s*(\d{1,2})$/);
  if(!m) return null;
  var h = parseInt(m[1],10), mi = parseInt(m[2],10);
  if(!(h>=0&&h<=23) || !(mi>=0&&mi<=59)) return null;
  return pad(h)+':'+pad(mi);
}
function uniq(a){ return a.filter(function(v,i){ return a.indexOf(v)===i; }); }
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); },2200);
}
function download(name, text, type){
  var blob = new Blob([text], {type: type||'application/json;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1500);
}

/* ------------------------------ 默认数据 ------------------------------ */
var DEFAULT_PERIODS = [
  {s:'08:00',e:'08:45'},{s:'08:55',e:'09:40'},
  {s:'10:00',e:'10:45'},{s:'10:55',e:'11:40'},
  {s:'14:00',e:'14:45'},{s:'14:55',e:'15:40'},
  {s:'16:00',e:'16:45'},{s:'16:55',e:'17:40'},
  {s:'19:00',e:'19:45'},{s:'19:55',e:'20:40'},
  {s:'20:50',e:'21:35'},{s:'21:45',e:'22:30'}
];

function defaultState(){
  return {
    settings:{ termStart: dstr(mondayOf(new Date())), totalWeeks: 20, showWeekend: true, theme: 'auto',
               userSetTerm: false, termHintClosed: false },
    periods: DEFAULT_PERIODS.map(function(p){ return {s:p.s,e:p.e}; }),
    courses: []
  };
}

function sampleCourses(){
  return [
    mk('高等数学 A','张伟','教一 101',1,1,2,'1-16'),
    mk('大学英语（读写）','李娜','外语楼 203',1,3,2,'1-16'),
    mk('程序设计基础','王强','计算机楼 305',2,1,2,'1-16'),
    mk('线性代数','刘洋','教二 204',2,5,2,'1-9'),
    mk('大学物理','陈静','理科楼 401',3,3,2,'1-16'),
    mk('数据结构','赵磊','计算机楼 302',3,5,2,'2-16双'),
    mk('体育（篮球）','孙鹏','东体育馆',4,3,2,'1-16'),
    mk('思想道德与法治','周敏','教三 108',4,7,2,'1-12'),
    mk('数据结构实验','赵磊','实验楼 B302',5,1,2,'3-16'),
    mk('概率论与数理统计','吴涛','教一 205',5,5,2,'1-16'),
    { id:uid(), name:'通识讲座 · 人工智能前沿', teacher:'校外专家', location:'图书馆报告厅',
      day:3, start:9, duration:2, weeks:'3-16', color:'#14b8a6',
      custom:{ s:'19:00', e:'20:30' }, note:'自定义时间示例' }
  ];
}
function mk(name,teacher,loc,day,start,dur,weeks){
  return { id:uid(), name:name, teacher:teacher, location:loc, day:day, start:start, duration:dur, weeks:weeks, color:'', note:'' };
}

/* ------------------------------ 状态 ------------------------------ */
var state = loadState();
var ui = { tab:'today', week:null, day:null, mode:null, query:'', pending:[], importQuery:'' };

function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    var d = JSON.parse(raw);
    var st = defaultState();
    if(d && typeof d==='object'){
      if(d.settings) {
        st.settings.termStart  = d.settings.termStart || st.settings.termStart;
        st.settings.totalWeeks = clamp(parseInt(d.settings.totalWeeks,10)||20, 1, 30);
        st.settings.showWeekend= d.settings.showWeekend !== false;
        st.settings.theme      = d.settings.theme || 'auto';
        st.settings.userSetTerm = !!d.settings.userSetTerm;
        st.settings.termHintClosed = !!d.settings.termHintClosed;
      }
      if(Array.isArray(d.periods) && d.periods.length){
        st.periods = d.periods.filter(function(p){ return p && p.s && p.e; }).map(function(p){ return {s:p.s,e:p.e}; });
        if(!st.periods.length) st.periods = DEFAULT_PERIODS.map(function(p){ return {s:p.s,e:p.e}; });
      }
      if(Array.isArray(d.courses)) st.courses = d.courses.map(normCourse).filter(Boolean);
    }
    return st;
  }catch(e){ return defaultState(); }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ toast('保存失败：浏览器存储空间不足'); }
}

/* 规范化一条课程记录 */
function normCourse(c){
  if(!c || typeof c!=='object') return null;
  var name = String(c.name==null?'':c.name).trim();
  if(!name) return null;
  var day = parseInt(c.day,10); if(!(day>=1&&day<=7)) day = 1;
  var start = parseInt(c.start,10); if(!(start>=1)) start = 1;
  var dur = parseInt(c.duration,10); if(!(dur>=1)) dur = 1; if(dur>12) dur = 12;
  var custom = null;
  if(c.custom && c.custom.s && c.custom.e){
    var cs = normalizeClock(c.custom.s), ce = normalizeClock(c.custom.e);
    if(cs && ce) custom = {s:cs, e:ce};
  }
  return {
    id: c.id || uid(),
    name: name,
    teacher: String(c.teacher==null?'':c.teacher).trim(),
    location: String(c.location==null?'':c.location).trim(),
    day: day, start: start, duration: dur,
    weeks: String(c.weeks==null?'':c.weeks).trim(),
    color: c.color || '',
    note: String(c.note==null?'':c.note).trim(),
    custom: custom
  };
}

/* ------------------------------ 时间/周次计算 ------------------------------ */
function courseTimes(c){
  var ps = state.periods, n = ps.length;
  if(c.custom && c.custom.s && c.custom.e){
    var s0=toMin(c.custom.s), e0=toMin(c.custom.e);
    if(e0<=s0) e0 = s0+45;
    return { start:c.custom.s, end:c.custom.e, s:s0, e:e0, mins:e0-s0, teach:e0-s0, label:'自定义时间', p1:null, p2:null };
  }
  var i = clamp((c.start||1)-1, 0, Math.max(0,n-1));
  var j = clamp(i + (c.duration||1) - 1, i, Math.max(0,n-1));
  var s = toMin(ps[i] ? ps[i].s : '08:00');
  var e = toMin(ps[j] ? ps[j].e : '08:45');
  var teach = 0;
  for(var k=i;k<=j;k++) teach += Math.max(0, toMin(ps[k].e)-toMin(ps[k].s));
  var label = (i===j) ? ('第'+(i+1)+'节') : ('第'+(i+1)+'-'+(j+1)+'节');
  return { start:ps[i]?ps[i].s:'', end:ps[j]?ps[j].e:'', s:s, e:e, mins:Math.max(0,e-s), teach:teach, label:label, p1:i+1, p2:j+1 };
}
function durText(t){
  var cnt = (t.p1 && t.p2) ? (t.p2-t.p1+1) : 0;
  return (cnt?('共'+cnt+'节 · '):'') + t.teach + '分钟';
}
/* 周次表达式 -> Set；返回 null 表示每周 */
function weekSet(str, total){
  total = total || state.settings.totalWeeks || 20;
  var raw = String(str==null?'':str).trim();
  if(!raw) return null;
  if(/全|每周|每周都|all/i.test(raw) && !/\d/.test(raw)) return null;
  var parity = /单/.test(raw) ? 'odd' : (/双/.test(raw) ? 'even' : null);
  var body = raw.replace(/第|周|学期|\s/g,'');
  var set = {};
  body.split(/[,，、;；\/]+/).forEach(function(part){
    var m = part.match(/^(\d+)\s*[-~至到]\s*(\d+)/);
    if(m){ for(var i=+m[1]; i<=+m[2] && i<=99; i++) set[i]=1; return; }
    var m2 = part.match(/^(\d+)/);
    if(m2) set[+m2[1]] = 1;
  });
  var keys = Object.keys(set);
  if(!keys.length){
    if(parity){ for(var w=1;w<=total;w++){ if((parity==='odd')===(w%2===1)) set[w]=1; } }
    else return null;
  }
  keys.forEach(function(k){
    var w = +k;
    if(parity==='odd' && w%2===0) delete set[k];
    if(parity==='even' && w%2===1) delete set[k];
  });
  keys = Object.keys(set);
  return keys.length ? set : null;
}
function weekText(str){
  var s = String(str||'').trim();
  return s ? (/\d/.test(s) ? (s + (/周/.test(s)?'':' 周')) : s) : '每周';
}
function inWeek(c, w){ var s = weekSet(c.weeks); return !s || !!s[w]; }

function currentWeek(){
  var start = mondayOf(parseDate(state.settings.termStart));
  var today = mondayOf(new Date());
  var diff = Math.round((today - start) / 604800000);
  return diff + 1;
}
function weekDates(w){
  var start = mondayOf(parseDate(state.settings.termStart));
  var mon = addDays(start, (w-1)*7);
  var out = [];
  for(var i=0;i<7;i++) out.push(addDays(mon,i));
  return out;
}
function coursesOn(day, w){
  return state.courses.filter(function(c){ return c.day===day && inWeek(c,w); })
    .sort(function(a,b){ return courseTimes(a).s - courseTimes(b).s; });
}
function colorOf(c){
  if(c.color) return c.color;
  var h=0, n=c.name||'';
  for(var i=0;i<n.length;i++) h = (h*31 + n.charCodeAt(i)) % 9973;
  return PALETTE[h % PALETTE.length];
}

/* ------------------------------ 导入解析 ------------------------------ */
/* 1) JSON（唤醒课程表等导出文件 / 自己写的数组） */
var FIELD_ALIASES = {
  name:     ['name','coursename','course','title','subject','课程','课程名称','科目','教学班名称','教学班','课程名'],
  teacher:  ['teacher','teachers','instructor','tutor','教师','老师','任课教师','授课教师','主讲教师'],
  location: ['location','room','classroom','place','address','教室','地点','上课地点','上课教室','场地'],
  day:      ['day','weekday','week','dayofweek','星期','周几','上课星期','星期几'],
  start:    ['start','startsection','startperiod','section','starts','begin','起始节','开始节','节次','起始节次','开始节次','第几节'],
  duration: ['duration','length','span','sections','sectioncount','节数','时长节数','连堂','连上','占用节数'],
  end:      ['end','endsection','endperiod','ends','结束节','结束节次'],
  weeks:    ['weeks','weeklist','weekstr','weekrange','周次','上课周次','周数','教学周'],
  time:     ['time','times','classtime','periodtime','时间','上课时间','上课节次'],
  color:    ['color','colour','颜色'],
  note:     ['note','remark','memo','备注','说明']
};
function pickField(obj, field){
  var keys = Object.keys(obj);
  var alias = FIELD_ALIASES[field];
  for(var i=0;i<alias.length;i++){
    var a = alias[i];
    for(var k=0;k<keys.length;k++){
      var kk = keys[k].toLowerCase().replace(/[\s_\-（）()]/g,'');
      if(kk === a.replace(/[\s_\-（）()]/g,'')) return obj[keys[k]];
    }
  }
  return undefined;
}
function flattenJSON(json){
  var arr = null;
  if(Array.isArray(json)) arr = json;
  else if(json && typeof json==='object'){
    var cands = ['courses','course','list','data','items','schedule','timetable','lessons','课表','课程'];
    for(var i=0;i<cands.length;i++){
      for(var k in json){
        if(k.toLowerCase() === cands[i] && Array.isArray(json[k])){ arr = json[k]; break; }
      }
      if(arr) break;
    }
    if(!arr){
      for(var k2 in json){ if(Array.isArray(json[k2]) && json[k2].length && typeof json[k2][0]==='object'){ arr = json[k2]; break; } }
    }
  }
  if(!arr){
    /* 有些导出是 { "1": [ ... ], "2": [ ... ] } 按星期分组 */
    var grouped = [];
    if(json && typeof json==='object'){
      Object.keys(json).forEach(function(k){
        if(Array.isArray(json[k]) && /^[1-7]$/.test(k)){
          json[k].forEach(function(o){ var c = Object.assign({}, o); if(c.day==null&&c.weekday==null) c.day = +k; grouped.push(c); });
        }
      });
    }
    arr = grouped;
  }
  return arr || [];
}
function parseJSONText(text){
  var json = JSON.parse(text);
  return flattenJSON(json).map(function(o){ return fromObject(o); }).filter(Boolean);
}
function fromObject(o){
  var name = pickField(o,'name');
  var rec = {
    name: name==null? '': String(name),
    teacher: pickField(o,'teacher') || '',
    location: pickField(o,'location') || '',
    day: null, start: null, duration: null, weeks: '', timeText: '', custom: null
  };
  var d = pickField(o,'day');
  if(d!=null){ rec.day = parseDay(String(d)); }
  var w = pickField(o,'weeks');
  if(w!=null) rec.weeks = Array.isArray(w) ? w.join(',') : String(w);
  var st = pickField(o,'start'), en = pickField(o,'end'), du = pickField(o,'duration');
  if(st!=null){ var ps = parseSection(String(st)); if(ps){ rec.start = ps.start; rec.duration = ps.duration; } }
  if(en!=null && rec.start){
    var pe = parseSection(String(en));
    if(pe && pe.start>=rec.start) rec.duration = pe.start - rec.start + 1;
  }
  if(du!=null && rec.start){
    var n = parseInt(String(du).replace(/[^\d]/g,''),10);
    if(n>=1) rec.duration = n;
  }
  var tt = pickField(o,'time');
  if(tt!=null) rec.timeText = String(tt);
  var col = pickField(o,'color'); if(col) rec.color = String(col);
  var nt = pickField(o,'note');  if(nt)  rec.note  = String(nt);
  /* time 字段里可能藏着 "周一 第1-2节" 或 "08:00-09:40" */
  if(rec.timeText){
    var extra = parseLine(rec.timeText, true);
    rec.day = rec.day || extra.day;
    if(!rec.start && extra.start){ rec.start = extra.start; rec.duration = extra.duration; }
    if(!rec.custom && extra.custom) rec.custom = extra.custom;
  }
  if(!rec.duration) rec.duration = 2;
  if(!rec.start) rec.start = 1;
  if(!rec.day) rec.day = 1;
  return rec;
}

/* 2) 表格（制表符/逗号/分号/｜） */
function splitRow(line, delim){
  var out=[], cur='', q=false;
  for(var i=0;i<line.length;i++){
    var ch = line[i];
    if(q){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;

function parseDay(s){

  }
  var m2 = str.match(/第?\s*(\d{1,2})\s*节/);
  if(m2 && +m2[1]>=1 && +m2[1]<=30) return {start:+m2[1], duration:1};

/* ── SST（共享字符串表，含 CONTINUE 跨记录）── */
function sstParse(blocks){

  var bi = 0, off = 8;
  function readRaw(n){
    var v = 0, got = 0;
    while(got < n){

      var b = blocks[bi];

    while(n > 0 && bi < blocks.length){

      if(left <= 0){ bi++; off = 0; continue; }
      var take = Math.min(n, left); off += take; n -= take;
    }

    if(off >= blocks[bi].length){ bi++; off = 0; if(bi >= blocks.length) break; }
    var cch;
    if(blocks[bi].length - off < 2){                       /* 长度字段跨块（极少见） */
      var lo = blocks[bi][off++];
      bi++; off = 0;
      if(bi >= blocks.length) break;
      cch = lo | (blocks[bi][off++] << 8);
    } else { cch = u16(blocks[bi], off); off += 2; }
    if(off >= blocks[bi].length){ bi++; off = 0; if(bi >= blocks.length) break; }
    var grbit = blocks[bi][off++];
    var compressed = !(grbit & 0x01);
    var chars = '', left2 = cch;
    while(left2 > 0){
      var b = blocks[bi];
      if(off >= b.length){
        bi++; off = 0;
        if(bi >= blocks.length) break;
        b = blocks[bi];
        grbit = b[off++];                                  /* 跨块后重新给出编码标志 */
        compressed = !(grbit & 0x01);

      if(compressed){

      } else {

        if(n2 <= 0) break;
        for(var k2=0;k2<n2;k2++){ chars += String.fromCharCode(b[off] | (b[off+1]<<8)); off += 2; }
        left2 -= n2;
      }
    }
    if(grbit & 0x08) skipRaw(readRaw(2)*4);                /* 富文本格式段 */
    if(grbit & 0x04) skipRaw(readRaw(4));                  /* 东亚扩展段 */

function cellsToRows(cells){

function sheetToTSV(sheet){
  return sheet.rows.map(function(r){

/* ==== XLSX(ZIP) 读取：零依赖，用 DecompressionStream 解压 ==== */
function xmlDecode(s){
  return String(s == null ? '' : s)
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")

    .replace(/&#(\d+);/g, function(_,d){ return String.fromCharCode(+d); })

function colIndex(ref){

function zipEntries(bytes){
  var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  for(var i=bytes.length-22; i>=0 && i>=bytes.length-66000; i--){
    if(dv.getUint32(i,true) === 0x06054b50){ eocd = i; break; }

    if(off+46 > bytes.length || dv.getUint32(off,true) !== 0x02014b50) break;
    var method = dv.getUint16(off+10, true);
    var csize = dv.getUint32(off+20, true);
    var nlen = dv.getUint16(off+28, true), elen = dv.getUint16(off+30, true), clen = dv.getUint16(off+32, true);

function zipRead(bytes, entry){

  if(entry.method !== 8) return Promise.reject(new Error('不支持的压缩方式'));

    return Promise.reject(new Error('当前浏览器版本过旧，无法解压 .xlsx。请在 Excel 里另存为 .xls，或直接复制单元格粘贴进来'));

function parseSharedStrings(xml){
  var out = [], re = /<si\b[^>]*>([\s\S]*?)<\/si>/g, m;
  while((m = re.exec(xml))){
    var t = '', tre = /<t\b[^>]*>([\s\S]*?)<\/t>/g, tm;
    while((tm = tre.exec(m[1]))) t += tm[1];
    out.push(xmlDecode(t));
  }

}
function parseSheetXml(xml, shared){
  var rows = [], rre = /<row\b([^>]*)>([\s\S]*?)<\/row>/g, rm;
  while((rm = rre.exec(xml))){
    var rn = parseInt((rm[1].match(/r="(\d+)"/) || [])[1], 10);
    if(!(rn >= 1)) rn = rows.length + 1;
    var cells = [], cre = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, cm;
    while((cm = cre.exec(rm[2]))){
      var attrs = cm[1], body = cm[2] || '';
      var ref = (attrs.match(/r="([A-Z]+)\d+"/) || [])[1];
      if(!ref) continue;
      var t = (attrs.match(/t="([^"]+)"/) || [])[1] || '';
      var val = '';
      if(t === 's'){
        var vm = body.match(/<v>([\s\S]*?)<\/v>/);
        val = vm ? (shared[+vm[1]] || '') : '';

        var ire = /<t\b[^>]*>([\s\S]*?)<\/t>/g, im, s2 = '';
        while((im = ire.exec(body))) s2 += im[1];
        val = xmlDecode(s2);
      } else {
        var vm2 = body.match(/<v>([\s\S]*?)<\/v>/);
        val = vm2 ? xmlDecode(vm2[1]) : '';

      if(val !== '') cells[colIndex(ref)] = val;
    }
    rows[rn-1] = cells;

  rows.forEach(function(r){ if(r) r.forEach(function(_, i){ if(i > maxC) maxC = i; }); });

    var row = rows[i2] || [], full = [], blank = true;
    for(var c=0;c<=maxC;c++){ var v = (row[c] == null ? '' : String(row[c])); full.push(v); if(v !== '') blank = false; }
    if(!blank) out.push(full);
  }

function xlsxToSheets(bytes){
  var idx = zipEntries(bytes);
  var shared = [], names = [];

  var p = Promise.resolve();
  if(ss) p = zipRead(bytes, ss).then(function(b){ shared = parseSharedStrings(decodeText(b)); });
  return p.then(function(){
    if(idx['xl/workbook.xml']){
      return zipRead(bytes, idx['xl/workbook.xml']).then(function(b){
        var xml = decodeText(b), re = /<sheet\b[^>]*\bname="([^"]*)"/g, m;
        while((m = re.exec(xml))) names.push(xmlDecode(m[1]));
      });
    }

    var fileNames = Object.keys(idx).filter(function(n){ return /^xl\/worksheets\/sheet\d+\.xml$/.test(n); })
      .sort(function(a,b){ return (+/(\d+)/.exec(a)[1]) - (+/(\d+)/.exec(b)[1]); });
    var sheets = [];
    return fileNames.reduce(function(chain, fn, i){
      return chain.then(function(){
        return zipRead(bytes, idx[fn]).then(function(b){
          sheets.push({ name: names[i] || ('Sheet'+(i+1)), rows: parseSheetXml(decodeText(b), shared) });
        });

/* ==== 文件输入：xls / xlsx / csv / txt / json，自动识别编码 ==== */
function decodeText(bytes){
  if(bytes.length > 2 && bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF) bytes = bytes.subarray(3);
  try{ return new TextDecoder('utf-8', { fatal:true }).decode(bytes); }
  catch(e){
    try{ return new TextDecoder('gb18030').decode(bytes); }catch(e2){}
    return new TextDecoder('utf-8').decode(bytes);
  }
}
/* 统一入口：结果回调 {text} 或 {sheets} 或 {error} */
function readFileAny(file, cb){
  var name = String(file.name || '').toLowerCase();
  var rd = new FileReader();
  rd.onerror = function(){ cb({ error: '文件读取失败' }); };
  rd.onload = function(){
    var bytes = new Uint8Array(rd.result);
    try{
      var isZip = bytes[0]===0x50 && bytes[1]===0x4B;                 /* PK → xlsx/zip */
      var isOle = bytes[0]===0xD0 && bytes[1]===0xCF;                 /* OLE2 → xls */
      if(isZip){
        xlsxToSheets(bytes).then(function(sheets){ cb({ sheets: sheets }); })
          .catch(function(e){ cb({ error: 'Excel(xlsx) 解析失败：' + e.message }); });
        return;
      }
      if(isOle){ cb({ sheets: xlsToSheets(bytes) }); return; }
      if(/\.xlsx?$/.test(name)){ cb({ error: '这个文件的扩展名是 Excel，但内容不是 Excel 格式（可能是网页导出的假 xls，请直接打开后全选复制粘贴）' }); return; }
      cb({ text: decodeText(bytes) });
    }catch(e){ cb({ error: '解析失败：' + e.message }); }
  };
  rd.readAsArrayBuffer(file);
}
/* 在多张工作表里挑解析出课程最多的那张 */

  } else if(next){
    html += '<div class="h-top"><span class="chip acc">下一节</span><span class="tiny muted">今天第 '+(list.indexOf(next)+1)+' 节</span></div>'+
      '<div class="h-name" style="color:'+colorOf(next.c)+'">'+esc(next.c.name)+'</div>'+

  }
  html += '</div>';

  /* 还没校准过学期时间 → 提示一次（周次不准大多是因为这个） */

      '（默认把本周当成第 1 周）。对不上就设一下开学时间，设完日期会自动跟着对齐。</span>'+
      '<button class="btn sm primary" data-act="term">设置开学时间</button>'+
      '<button class="btn sm ghost" data-act="termhint">知道了</button>'+
      '</div>';
  }

  /* 今日时间轴 */
  html += '<div class="day-head"><div><div class="d1">'+cnDate(now)+' '+DAYS[d-1]+'</div>'+
          '<div class="d2">第 <b>'+w+'</b> 周 · 今天 '+list.length+' 节课 · '+
          '<button class="linkbtn" data-act="term">调整学期时间</button></div></div>'+
          '<button class="btn sm primary" data-act="add">＋ 添加课程</button></div>';

  if(list.length){
    html += '<div class="tl">';
    list.forEach(function(x){
      var st = statusOf(x.t, nowMin);
      html += '<div class="tl-item">'+
        '<div class="tl-time"><div class="t1">'+x.t.start+'</div><div class="t2">'+x.t.end+'</div>'+
          '<div class="t2">'+esc(shortLabel(x.t))+'</div></div>'+
        '<div class="tl-card '+st.cls+'" style="--c:'+colorOf(x.c)+'" data-act="edit" data-id="'+x.c.id+'">'+
          '<div class="c1"><span class="cname">'+esc(x.c.name)+'</span><span class="chip '+st.chip+'">'+st.text+'</span></div>'+
          '<div class="cmeta">'+metaSpans(x.c, x.t)+'</div>'+
        '</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="card empty" style="margin-top:12px"><span class="big">🌤️</span>今天没有安排课程<br><span class="tiny">点击右上角「＋ 添加课程」开始排课</span></div>';
  }

  /* 即将到来 */
  var upcoming = [];
  for(var k=0;k<7 && upcoming.length<4;k++){
    var dd = addDays(now, k), di = dayIndex(dd), ww = currentWeek() + Math.floor((mondayOf(dd) - mondayOf(now))/604800000);
    coursesOn(di, ww).forEach(function(c){
      var t = courseTimes(c);
      if(k===0 && t.e <= nowMin) return;
      if(k===0 && nowMin >= t.s && nowMin < t.e) return;
      if(upcoming.length<4) upcoming.push({d:dd,c:c,t:t,k:k});
    });
  }
  if(upcoming.length){
    html += '<div class="sec-title"><h2>接下来</h2><span class="hint">未来 7 天</span></div><div class="tl">';
    upcoming.slice(0,4).forEach(function(u){
      html += '<div class="tl-item"><div class="tl-time"><div class="t1">'+esc(u.k===0?'今天':(u.k===1?'明天':DAYS[dayIndex(u.d)-1]))+'</div>'+

        '<div class="cmeta">'+metaSpans(u.c, u.t)+'</div></div></div>';

}
function colorNameTag(c){ return weekText(c.weeks) + ' · ' + courseTimes(c).label; }
function shortLabel(t){ return (t.p1 && t.p2) ? (t.p1===t.p2 ? ('第'+t.p1+'节') : (t.p1+'-'+t.p2+'节')) : '自定义'; }
function metaSpans(c, t){
  var out = [];
  if(c.location) out.push('<span>📍 <b>'+esc(c.location)+'</b></span>');
  if(c.teacher)  out.push('<span>👤 '+esc(c.teacher)+'</span>');
  out.push('<span>⏱ '+durText(t)+'</span>');
  out.push('<span>🗓 '+esc(weekText(c.weeks))+'</span>');
  if(c.note) out.push('<span>📝 '+esc(c.note)+'</span>');
  return out.join('');
}
function statusOf(t, nowMin){
  if(nowMin >= t.e) return {cls:'past', chip:'mute', text:'已结束'};
  if(nowMin >= t.s) return {cls:'now',  chip:'ok',   text:'进行中'};
  var d = t.s - nowMin;
  return {cls:'', chip:'acc', text: (d<=60 ? d+' 分钟后' : Math.floor(d/60)+' 小时 '+(d%60)+' 分后')};
}

/* ------------------------------ 渲染：周课表 ------------------------------ */
function isNarrow(){ return (window.innerWidth || 1200) <= 640; }
function gridMode(){ return ui.mode || (isNarrow() ? 'day' : 'week'); }
function modeToggleHtml(){
  var m = gridMode();
  return '<div class="seg">'+
    '<button data-act="gmode" data-mode="day" class="'+(m==='day'?'on':'')+'">单日</button>'+
    '<button data-act="gmode" data-mode="week" class="'+(m==='week'?'on':'')+'">整周</button></div>';

/* 课表页：窄屏默认「单日时间轴」（不用横向拖），宽屏默认「整周网格」，可手动切换 */
function renderGrid(){
  var w = (ui.week==null) ? currentWeek() : ui.week;
  if(gridMode()==='day') renderDayBoard(w);
  else renderWeekGrid(w);
}
function renderWeekGrid(w){
  var el = $('#v-grid');
  var days = state.settings.showWeekend ? 7 : 5;
  var dates = weekDates(w);
  var todayIdx = (w === currentWeek()) ? dayIndex(new Date()) : -1;
  var n = state.periods.length;

  var items = [];
  state.courses.forEach(function(c){
    if(c.day > days || !inWeek(c,w)) return;
    var t = courseTimes(c);
    var pos = gridPos(t);
    items.push({c:c, t:t, pos:pos});
  });
  /* 按天分列，处理同一时间段的并排显示 */
  var perDay = {};
  items.forEach(function(it){ (perDay[it.c.day] = perDay[it.c.day] || []).push(it); });
  Object.keys(perDay).forEach(function(d){
    var arr = perDay[d].sort(function(a,b){ return a.pos.start - b.pos.start || a.pos.span - b.pos.span; });
    var cluster = [], clusterEnd = 0, flush = function(){
      if(!cluster.length) return;
      var cols = [];
      cluster.forEach(function(it){
        var placed = false;
        for(var i=0;i<cols.length;i++){ if(cols[i] <= it.pos.start){ cols[i] = it.pos.start + it.pos.span; it.col = i; placed = true; break; } }
        if(!placed){ it.col = cols.length; cols.push(it.pos.start + it.pos.span); }
      });
      cluster.forEach(function(it){ it.ncol = cols.length; });
      cluster = [];
    };
    arr.forEach(function(it){
      if(cluster.length && it.pos.start >= clusterEnd){ flush(); clusterEnd = 0; }
      cluster.push(it);
      clusterEnd = Math.max(clusterEnd, it.pos.start + it.pos.span);
    });
    flush();
  });

  var html = '';
  html += '<div class="weekbar">'+
    '<button class="btn sm" data-act="week" data-delta="-1">◀ 上一周</button>'+
    '<span class="wk" data-act="term" title="调整学期开始时间">第 '+w+' 周</span>'+
    '<button class="btn sm" data-act="week" data-delta="1">下一周 ▶</button>'+
    (w!==currentWeek() ? '<button class="btn sm" data-act="weeknow">回到本周</button>' : '<span class="chip acc">本周</span>')+
    '<span style="flex:1"></span>'+
    modeToggleHtml()+
    '<button class="btn sm" data-act="weekpick">跳到第…周</button>'+
    '<button class="btn sm primary" data-act="add">＋ 添加课程</button>'+
    '</div>';

  html += '<div class="grid-scroll"><div class="tt-inner" style="--days:'+days+'"><div class="tt" style="--days:'+days+';grid-template-columns:var(--gutter) repeat('+days+',minmax(0,1fr));grid-template-rows:'+state.settings.__headh+'px repeat('+n+','+state.settings.__rowh+'px)">';
  /* 表头 */
  html += '<div class="hd" style="grid-column:1;grid-row:1;background:var(--card)"><small>节次</small></div>';
  for(var d=1; d<=days; d++){
    var isT = (d===todayIdx);
    html += '<div class="hd'+(isT?' today':'')+'" style="grid-column:'+(d+1)+';grid-row:1"><span>'+DAYS[d-1]+'</span><small>'+mdText(dates[d-1])+'</small></div>';
  }
  /* 行：节次栏 + 空网格（全部显式定位，避免自动放置错位） */
  for(var p=1; p<=n; p++){
    html += '<div class="gut" style="grid-column:1;grid-row:'+(p+1)+'"><b>'+p+'</b><span>'+state.periods[p-1].s+'</span><span>'+state.periods[p-1].e+'</span></div>';
    for(var d2=1; d2<=days; d2++){
      html += '<div class="cell'+(p%2===0?' alt':'')+'" style="grid-column:'+(d2+1)+';grid-row:'+(p+1)+'" data-act="cell" data-day="'+d2+'" data-p="'+p+'"></div>';
    }
  }
  /* 课程块 */
  items.forEach(function(it){
    var t = it.t, c = it.c, pos = it.pos;
    var ncol = it.ncol||1, col = it.col||0;
    var left = 'calc(' + (col*100/ncol) + '% + 3px)';
    var width = 'calc(' + (100/ncol) + '% - 6px)';
    var weeks = weekText(c.weeks);
    html += '<div class="cw" style="grid-column:'+(c.day+1)+';grid-row:'+(pos.start+1)+' / span '+Math.max(1,pos.span)+'">'+
      '<div class="c" data-act="edit" data-id="'+c.id+'" style="left:'+left+';width:'+width+';top:3px;bottom:3px;background:'+colorOf(c)+'" title="'+esc(c.name+' '+t.start+'-'+t.end)+'">'+
      (pos.custom?'<span class="tag">自定义</span>':'')+
      '<div class="n">'+esc(c.name)+'</div>'+
      '<div class="m">'+esc(t.start)+'-'+esc(t.end)+'</div>'+
      '<div class="m">'+esc(c.location||'')+(c.location&&c.teacher?' · ':'')+esc(c.teacher||'')+'</div>'+
      '<div class="m">'+esc(weeks)+'</div>'+
      '</div></div>';
  });
  html += '</div>';
  /* 当前时间线 */
  if(w === currentWeek()){
    var now = new Date(), nm = now.getHours()*60 + now.getMinutes();
    var yy = null;
    for(var i=0;i<n;i++){
      var ps0 = toMin(state.periods[i].s), pe0 = toMin(state.periods[i].e);
      if(nm>=ps0 && nm<=pe0){ yy = state.settings.__headh + i*state.settings.__rowh + (nm-ps0)/Math.max(1,pe0-ps0)*state.settings.__rowh; break; }
    }
    if(yy==null){
      if(nm < toMin(state.periods[0].s)) yy = state.settings.__headh;
      else if(nm > toMin(state.periods[n-1].e)) yy = state.settings.__headh + n*state.settings.__rowh;
    }
    if(yy!=null){
      var di = dayIndex(now);
      var line = '<div class="nowline" style="top:'+yy+'px;left:0;right:0"></div>';
      if(di<=days){
        var lft = 'calc(var(--gutter) + ' + (di-1) + ' * (100% - var(--gutter)) / ' + days + ')';
        line += '<div class="nowline" style="top:'+yy+'px;left:'+lft+';width:calc((100% - var(--gutter)) / '+days+')"></div>';
      }
      html += line;
    }
  }
  html += '</div></div>';

  var totalWeek = items.reduce(function(a,it){ return a + (it.pos.span||1); }, 0);
  html += '<div class="legend"><span class="chip mute">本周 '+items.length+' 门课 · 共 '+totalWeek+' 节</span>'+
          '<span class="chip mute">点击空白格可快速添加</span>'+
          '<span class="chip mute">点击课程可编辑</span>'+
          '<span class="chip mute">红色横线 = 当前时间</span></div>';
  el.innerHTML = html;
}
/* 单日时间轴：手机上一屏看完一天的课，左右滑动换天，点空行即添加 */
function renderDayBoard(w){
  var el = $('#v-grid');
  var days = state.settings.showWeekend ? 7 : 5;
  var today = dayIndex(new Date());
  var day = (ui.day >= 1 && ui.day <= days) ? ui.day : (today <= days ? today : 1);
  var dates = weekDates(w);
  var isThisWeek = (w === currentWeek());
  var now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();

  var items = [];
  state.courses.forEach(function(c){
    if(c.day !== day || !inWeek(c, w)) return;
    var t = courseTimes(c);
    items.push({ c:c, t:t, pos:gridPos(t) });
  });
  items.sort(function(a,b){ return a.pos.start - b.pos.start; });
  var covered = {};
  items.forEach(function(it){ for(var k=1;k<it.pos.span;k++) covered[it.pos.start+k] = 1; });

  var html = '';
  html += '<div class="weekbar">'+
    '<button class="btn sm" data-act="week" data-delta="-1">◀</button>'+
    '<span class="wk" data-act="term" title="调整学期开始时间">第 '+w+' 周</span>'+
    '<button class="btn sm" data-act="week" data-delta="1">▶</button>'+
    (isThisWeek ? '<span class="chip acc">本周</span>' : '<button class="btn sm" data-act="weeknow">回到本周</button>')+
    '<span style="flex:1"></span>'+ modeToggleHtml() +
    '<button class="btn sm primary" data-act="add" data-day="'+day+'">＋ 添加</button>'+
    '</div>';

  html += '<div class="daystrip">';
  for(var d=1; d<=days; d++){
    var dt = dates[d-1];
    var n = coursesOn(d, w).length;
    html += '<button class="dchip'+(d===day?' on':'')+'" data-act="gday" data-day="'+d+'">'+
      '<b>'+DAYS[d-1].replace('周','')+'</b><span>'+mdText(dt)+'</span>'+
      (n ? '<i class="dot2"></i>' : '')+
      '</button>';
  }
  html += '</div>';

  html += '<div class="dboard">';
  for(var p=1; p<=state.periods.length; p++){
    var ps = state.periods[p-1];
    if(covered[p]){
      /* 被上面的连堂课占用：画一条延续色条，保持节次编号连续 */
      var up = items.filter(function(x){ return x.pos.start < p && x.pos.start + x.pos.span > p; })[0];
      html += '<div class="drow cont">'+
        '<div class="dgut"><b>第'+p+'节</b><span>'+ps.s+'</span></div>'+
        '<div class="dbody cont" style="--cc:'+(up ? colorOf(up.c) : 'var(--line2)')+'"></div>'+
        '</div>';
      continue;
    }
    var isNow = (isThisWeek && day === today && nowMin >= toMin(ps.s) && nowMin < toMin(ps.e));
    var mine = items.filter(function(x){ return x.pos.start === p; });
    html += '<div class="drow" data-act="cell" data-day="'+day+'" data-p="'+p+'">'+
      '<div class="dgut"><b>第'+p+'节</b><span>'+ps.s+'</span></div>'+
      '<div class="dbody'+(mine.length?'':' free')+(isNow?' now':'')+'">';
    mine.forEach(function(it){
      var c = it.c, t = it.t;
      html += '<div class="dcard" data-act="edit" data-id="'+c.id+'" style="background:'+colorOf(c)+'">'+
        '<div class="n">'+esc(c.name)+'</div>'+
        '<div class="tm">'+t.start+'–'+t.end+'　'+esc(shortLabel(t))+' · '+durText(t)+'</div>'+
        '<div class="m">'+[c.location, c.teacher, weekText(c.weeks)].filter(Boolean).map(esc).join(' · ')+'</div>'+
        (c.note ? '<div class="m">📝 '+esc(c.note)+'</div>' : '')+
        '</div>';
    });
    html += '</div></div>';
  }
  html += '</div>';

  var total = items.reduce(function(a,it){ return a + (it.pos.span||1); }, 0);
  html += '<div class="legend"><span class="chip mute">'+DAYS[day-1]+' '+mdText(dates[day-1])+' · '+items.length+' 门课 / 共 '+total+' 节</span>'+
          '<span class="chip mute">左右滑动切换星期</span>'+
          '<span class="chip mute">点击空白行可添加</span></div>';
  el.innerHTML = html;
}
function gridPos(t){
  if(t.p1) return {start:t.p1, span:Math.max(1,(t.p2-t.p1+1)), custom:false};
  var ps = state.periods, best=1, bd=1e9;
  ps.forEach(function(p,i){ var d=Math.abs(toMin(p.s)-t.s); if(d<bd){ bd=d; best=i+1; } });
  /* 估算自定义时长的跨行数 */
  var rows = 0, acc = 0, idx = best-1;
  while(acc < t.mins && idx < ps.length){ acc += Math.max(15, toMin(ps[idx].e)-toMin(ps[idx].s)); rows++; idx++; }
  return {start:best, span:Math.max(1, rows), custom:true};
}

        '<div class="lm"><span>🕐 '+t.start+'–'+t.end+'（'+esc(shortLabel(t))+' · '+durText(t)+'）</span>'+
        (c.location?'<span>📍 '+hl(c.location,q)+'</span>':'')+
        (c.teacher?'<span>👤 '+hl(c.teacher,q)+'</span>':'')+
        '<span>🗓 '+esc(weekText(c.weeks))+'</span>'+
        (c.note?'<span>📝 '+esc(c.note)+'</span>':'')+'</div></div>'+
        '<div class="acts">'+
          '<button class="btn sm ghost" data-act="edit" data-id="'+c.id+'" title="编辑">✏️</button>'+
          '<button class="btn sm ghost" data-act="dup" data-id="'+c.id+'" title="复制到其它时间">⧉</button>'+
          '<button class="btn sm ghost" data-act="del" data-id="'+c.id+'" title="删除">🗑</button>'+
        '</div></div>';
    });
    html += '</div>';
  });
  el.innerHTML = html;
}
function hl(text, q){
  var s = esc(text);
  if(!q) return s;
  try{
    var re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    return s.replace(re,'<mark>$1</mark>');
  }catch(e){ return s; }
}

/* ------------------------------ 弹层 ------------------------------ */
var modalOpen = false;
function openModal(html, wide){
  var root = $('#modal');
  root.innerHTML = '<div class="mask"><div class="sheet'+(wide?' wide':'')+'">'+html+'</div></div>';
  root.classList.add('open'); modalOpen = true;
  document.body.style.overflow = 'hidden';
  var mask = $('.mask', root);
  mask.addEventListener('click', function(e){ if(e.target===mask) closeModal(); });
  /* 返回本次新建的 .sheet：监听器随弹层一起被销毁，避免重复绑定 */
  return $('.sheet', root);
}
function closeModal(){
  var root = $('#modal');
  root.innerHTML=''; root.classList.remove('open'); modalOpen=false;
  document.body.style.overflow='';
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && modalOpen) closeModal(); });

      id: c.id || uid(),
      name: $('#fName').value.trim(),
      teacher: $('#fTeacher').value.trim(),

      day: +$('#fDay').value,
      start: +$('#fStart').value,
      duration: +$('#fDur').value,
      weeks: $('#fWeeks').value.trim(),

    };

    var r = read(), t = courseTimes(r);
    $('#fPreview').innerHTML = '⏰ <b>'+DAYS[r.day-1]+' '+t.start+' – '+t.end+'</b>　'+esc(shortLabel(t))+'　时长 '+durText(t)+

      chosen = i.dataset.col;

  root.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if(!b) return;

    if(a==='close') closeModal();
    else if(a==='clearcustom'){ $('#fCS').value=''; $('#fCE').value=''; preview(); }

      var rec = read();
      if(!rec.name){ toast('请填写课程名称'); $('#fName').focus(); return; }

        save(); closeModal(); renderAll(); toast('已删除');
      }
    }
  });

/* ------------------------------ 学期时间校准 ------------------------------ */
/* 周次和每日日期都由「开学第一周的周一」推算。这里既能填日期，也能填「今天第几周」，两者联动。 */
function openTermDialog(){
  var now = new Date(), thisMon = mondayOf(now);
  var curStart = mondayOf(parseDate(state.settings.termStart));
  var curWeek = clamp(Math.round((thisMon - curStart) / 604800000) + 1, 1, 40);

  var html = '<h3>设置学期时间</h3>'+
    '<div class="sh-sub">周次和每天的日期都按这里推算，对不上就改一下。下面两项填任意一个，另一个自动跟着变。</div>'+
    '<div class="mrow one"><div><label>今天是第几周</label>'+
      '<div class="row"><input type="number" id="tWeek" min="1" max="40" value="'+curWeek+'" style="width:104px">'+
      '<span class="tiny muted">今天是 '+cnDate(now)+' '+DAYS[dayIndex(now)-1]+'</span></div></div></div>'+
    '<div class="mrow one"><div><label>开学第一周的周一</label>'+
      '<input type="date" id="tStart" value="'+dstr(curStart)+'"></div></div>'+
    '<div class="note" id="tPreview" style="margin-top:12px"></div>'+
    '<div class="row" style="margin-top:10px">'+
      '<button class="btn sm" data-act="tprev">← 提前一周</button>'+
      '<button class="btn sm" data-act="tnext">推后一周 →</button>'+
      '<button class="btn sm" data-act="tthis">本周就是第 1 周</button>'+
    '</div>'+
    '<div class="foot"><button class="btn" data-act="close">取消</button>'+
    '<button class="btn primary" data-act="tsave">保存</button></div>';

  var root = openModal(html);

  function draw(){
    var w = clamp(parseInt($('#tWeek', root).value, 10) || 1, 1, 40);
    var raw = $('#tStart', root).value;
    var st = mondayOf(parseDate(raw || dstr(curStart)));
    var warn = (raw && dstr(parseDate(raw)) !== dstr(st))
      ? '<br>⚠️ 选的不是周一，已按它所在那一周的周一 <b>'+mdText(st)+'</b> 计算' : '';
    $('#tPreview', root).innerHTML =
      '开学第一周：<b>'+cnDate(st)+'</b>（周一）～ '+cnDate(addDays(st,6))+'（周日）<br>'+
      '本周 '+mdText(thisMon)+' ~ '+mdText(addDays(thisMon,6))+' 就是第 <b>'+w+'</b> 周'+warn;
  }
  function fromWeek(){
    var w = clamp(parseInt($('#tWeek', root).value, 10) || 1, 1, 40);
    $('#tStart', root).value = dstr(addDays(thisMon, -(w-1)*7));
    draw();
  }
  function fromStart(){
    var st = mondayOf(parseDate($('#tStart', root).value || dstr(curStart)));
    $('#tWeek', root).value = clamp(Math.round((thisMon - st) / 604800000) + 1, 1, 40);
    draw();
  }
  $('#tWeek', root).addEventListener('input', fromWeek);
  $('#tStart', root).addEventListener('change', fromStart);
  draw();

  root.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if(!b) return;
    var a = b.dataset.act;
    if(a==='close') closeModal();
    else if(a==='tthis'){ $('#tWeek', root).value = 1; fromWeek(); }
    else if(a==='tprev'){ $('#tWeek', root).value = clamp((parseInt($('#tWeek', root).value,10)||1) - 1, 1, 40); fromWeek(); }
    else if(a==='tnext'){ $('#tWeek', root).value = clamp((parseInt($('#tWeek', root).value,10)||1) + 1, 1, 40); fromWeek(); }
    else if(a==='tsave'){
      var st = mondayOf(parseDate($('#tStart', root).value || dstr(curStart)));
      state.settings.termStart = dstr(st);
      state.settings.userSetTerm = true;
      ui.week = null;
      save(); closeModal(); renderAll();
      toast('已设置：第 1 周从 '+mdText(st)+' 开始，本周是第 '+
        (Math.round((thisMon - st)/604800000)+1)+' 周');
    }
  });
  return root;
}

}

    '识别规则：<code>周次</code> 支持 <code>1-16</code>、<code>1-16单</code>、<code>2-16双</code>、<code>1,3,5</code>；'+
    '<code>节次</code> 支持 <code>1-2节</code>、<code>第3-4节</code>、<code>9、10、11节</code>；也支持 <code>08:00-09:40</code> 这类具体时间。</div>'+
    '<div id="impPreview"></div>';

  var root = openModal(html, true);

  /* 拖拽文件 */
  var ta = $('#impText', root);
  ['dragenter','dragover'].forEach(function(t){
    ta.addEventListener(t, function(e){ e.preventDefault(); ta.classList.add('dragging'); });
  });
  ['dragleave','dragend'].forEach(function(t){
    ta.addEventListener(t, function(e){ e.preventDefault(); ta.classList.remove('dragging'); });
  });
  ta.addEventListener('drop', function(e){
    e.preventDefault(); ta.classList.remove('dragging');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) loadFile(f);
  });
  root.addEventListener('dragover', function(e){ e.preventDefault(); });
  root.addEventListener('drop', function(e){
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) loadFile(f);
  });

  /* 读取任意课表文件（Excel / CSV / 文本 / JSON） */
  function loadFile(file){
    var note = $('#impNote', root);
    if(note) note.textContent = '正在解析「' + file.name + '」…';
    readFileAny(file, function(res){
      if(res.error){ if(note) note.textContent = ''; toast(res.error); return; }
      var text = '', info = '';
      if(res.sheets){
        if(!res.sheets.length){ if(note) note.textContent = ''; toast('文件里没有工作表'); return; }
        var pick = bestSheet(res.sheets);
        if(!pick){ toast('没有读到内容'); return; }
        text = pick.text;
        lastDetected = pick.det;
        info = '已解析「' + file.name + '」的工作表：' + pick.name +
               (res.sheets.length > 1 ? '（共 ' + res.sheets.length + ' 张，已选课程最多的那张）' : '');
      } else {
        text = res.text || '';
        info = '已读取文件：' + file.name;
      }
      ta.value = text;
      var list = parseAnyText(text);
      if(note) note.textContent = info + ' · 识别到 ' + list.length + ' 条记录';
      showPreview(list);
    });
  }

  function showPreview(list){
    ui.pending = list;
    var box = $('#impPreview', root);
    if(!list.length){ box.innerHTML = '<div class="note" style="margin-top:14px">没有识别到任何课程，请检查粘贴内容，或换一种格式。</div>'; return; }
    var rows = '';
    list.forEach(function(r,i){
      var bad = !r.name, unk = !!r.unknown;
      rows += '<tr data-i="'+i+'" class="'+(bad?'bad':'')+'">'+
        '<td><input type="checkbox" class="pk"'+(unk?'':' checked')+'></td>'+
        '<td><input type="text" data-f="name" value="'+esc(r.name)+'"></td>'+
        '<td><input type="text" data-f="teacher" value="'+esc(r.teacher)+'"></td>'+
        '<td><input type="text" data-f="location" value="'+esc(r.location)+'"></td>'+
        '<td><input type="number" data-f="day" min="1" max="7" value="'+(r.day||1)+'" style="width:52px"></td>'+
        '<td><input type="number" data-f="start" min="1" max="20" value="'+(r.start||1)+'" style="width:52px"></td>'+
        '<td><input type="number" data-f="duration" min="1" max="8" value="'+(r.duration||2)+'" style="width:52px"></td>'+
        '<td><input type="text" data-f="weeks" value="'+esc(r.weeks)+'" placeholder="1-16"></td>'+
        '<td><input type="text" data-f="custom" value="'+esc(r.custom?(r.custom.s+'-'+r.custom.e):'')+'" placeholder="19:00-20:30" style="width:104px"></td>'+
        '<td class="tt-cell" data-role="tt">'+ttCell(r)+'</td>'+
      '</tr>';
    });
    var dups = countDup(list);
    var unkCount = list.filter(function(r){ return r.unknown; }).length;
    /* 检测到学校真实作息时间 → 让用户选择是否一并应用 */
    var detHtml = '';
    if(lastDetected && lastDetected.periods && lastDetected.periods.length){
      var dp = lastDetected.periods;
      detHtml = '<div class="note" style="margin-top:12px;border-style:solid;border-color:color-mix(in srgb,var(--accent) 45%,var(--line2))">'+
        '<label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer;color:var(--text)">'+
        '<input type="checkbox" id="useDetected" checked style="margin-top:3px;flex:none">'+
        '<span><b>检测到学校真实作息时间</b>（共 '+dp.length+' 节，第1节 '+dp[0].s+'–'+dp[0].e+'）——勾选后导入时会一并替换作息表，课程时间按学校时间换算</span></label>'+
        '<div class="tiny" style="margin-top:6px">'+dp.map(function(p,i){ return '第'+(i+1)+'节 '+p.s+'-'+p.e; }).join(' · ')+'</div>'+
        '</div>';
    }
    box.innerHTML = '<div class="sec-title"><h2>识别结果 <span class="chip acc">'+list.length+' 条</span>'+
      (unkCount?' <span class="chip warn">'+unkCount+' 条时间未识别</span>':'')+'</h2>'+
      '<span class="hint">可直接修改单元格；取消勾选则不导入</span></div>'+
      detHtml+
      '<div class="preview-wrap"><table class="prev"><thead><tr>'+
      '<th style="width:34px"><input type="checkbox" id="ckAll" checked></th><th>课程名称</th><th>教师</th><th>地点</th><th>星期</th><th>起始节</th><th>节数</th><th>周次</th><th>自定义时间</th><th>换算结果</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="row" style="margin-top:12px">'+
        '<label class="tiny muted">重复课程处理：</label>'+
        '<select id="dupMode"><option value="skip">跳过重复</option><option value="over">覆盖已有</option><option value="all">全部导入</option></select>'+
        '<span class="chip mute">检测到 '+dups+' 条与现有课表重复</span>'+
        '<span style="flex:1"></span>'+
        '<span class="tiny muted" id="pickCount">已选 0 条</span>'+
      '</div>'+
      '<div class="foot"><button class="btn" data-act="close">取消</button>'+
      '<button class="btn primary" data-act="doimport">✅ 全部导入</button></div>';

    box.addEventListener('input', function(e){
      var tr = e.target.closest('tr[data-i]'); if(!tr) return;
      var r = list[+tr.dataset.i];
      var f = e.target.dataset.f;
      if(!f || !r) return;
      if(f==='custom'){
        var m = String(e.target.value).match(/(\d{1,2}:\d{2})\s*[-~至到]\s*(\d{1,2}:\d{2})/);
        r.custom = m ? {s:pad(+m[1].split(':')[0])+':'+m[1].split(':')[1], e:pad(+m[2].split(':')[0])+':'+m[2].split(':')[1]} : null;
      } else if(f==='day'||f==='start'||f==='duration'){ r[f] = parseInt(e.target.value,10)||1; }
      else r[f] = e.target.value;
      var cell = $('[data-role="tt"]', tr);
      if(cell) cell.innerHTML = ttCell(r);
    });
    box.addEventListener('change', function(e){
      if(e.target.id==='ckAll'){ $$('.pk', box).forEach(function(c){ c.checked = e.target.checked; }); }
      if(e.target.id==='useDetected'){
        /* 切换作息表后，换算结果整体重算 */
        $$('tr[data-i]', box).forEach(function(tr){
          var r = list[+tr.dataset.i], cell = $('[data-role="tt"]', tr);
          if(r && cell) cell.innerHTML = ttCell(r);
        });
      }
      if(e.target.classList.contains('pk') || e.target.id==='ckAll') updatePick();
    });
    function updatePick(){
      var n = $$('.pk', box).filter(function(c){ return c.checked; }).length;
      var pc = $('#pickCount', box); if(pc) pc.textContent = '已选 '+n+' 条';
      var btn = $('[data-act="doimport"]', box);
      if(btn) btn.textContent = '✅ 全部导入（'+n+' 条）';
    }
    updatePick();
  }
  function useDetectedNow(){
    var cb = $('#useDetected', root);
    return !!(cb && cb.checked && lastDetected && lastDetected.periods);
  }
  function ttCell(r){
    var chip = r.unknown ? '<span class="chip warn">时间未识别</span> ' : '';
    return chip + previewTime(r);
  }
  function previewTime(r){
    if(r.custom) return DAYS[(r.day||1)-1]+' '+r.custom.s+'–'+r.custom.e+' · 自定义';
    var saved = state.periods;
    if(useDetectedNow()) state.periods = lastDetected.periods;
    var t = courseTimes({start:r.start||1, duration:r.duration||1, custom:null});
    state.periods = saved;
    return DAYS[(r.day||1)-1]+' '+t.start+'–'+t.end+' · '+durText(t);
  }
  function countDup(list){
    var n=0;
    list.forEach(function(r){ if(state.courses.some(function(c){ return c.name===r.name && c.day===r.day && c.start===r.start && (c.weeks||'')===(r.weeks||''); })) n++; });
    return n;
  }

  root.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]'); if(!b) return;
    var a = b.dataset.act;
    if(a==='close') closeModal();
    else if(a==='fillsample'){ $('#impText').value = SAMPLE_TEXT; $('#impText').focus(); }
    else if(a==='filljson'){ $('#impText').value = JSON.stringify({courses:[
        {name:'大学英语（听说）',teacher:'王芳',room:'外语楼 305',weekday:2,startSection:3,endSection:4,weeks:'1-16'},
        {name:'人工智能导论',teacher:'李强',location:'计算机楼 401',day:4,start:5,duration:2,weeks:'2-16双'}
      ]}, null, 2); }
    else if(a==='impfile'){ $('#impFile', root).click(); }
    else if(a==='parse'){
      var txt = $('#impText').value;
      if(!txt.trim()){ toast('请先粘贴课表内容'); return; }
      var list = parseAnyText(txt);
      if(!list.length){ toast('没有识别到课程，试试「填入示例」看看格式'); }
      showPreview(list);
    }
    else if(a==='doimport'){
      var picked = readPicked();
      if(!picked.length){ toast('请至少勾选一条课程'); return; }
      /* 勾选了「学校作息时间」就先替换作息表，课程时间随之换算 */
      if(useDetectedNow()){
        state.periods = lastDetected.periods.map(function(p){ return { s:p.s, e:p.e }; });
      }
      var mode = ($('#dupMode')||{}).value || 'skip';
      var added=0, over=0, skip=0;
      picked.forEach(function(r){
        var rec = normCourse(r);
        if(!rec) return;
        var idx = state.courses.findIndex(function(c){ return c.name===rec.name && c.day===rec.day && c.start===rec.start && (c.weeks||'')===(rec.weeks||''); });
        if(idx>=0){
          if(mode==='skip'){ skip++; return; }
          if(mode==='over'){ rec.id = state.courses[idx].id; state.courses[idx] = rec; over++; return; }
        }
        state.courses.push(rec); added++;
      });
      save(); closeModal(); setTab('grid'); renderAll();
      toast('导入完成：新增 '+added+' 条'+(over?('，覆盖 '+over+' 条'):'')+(skip?('，跳过重复 '+skip+' 条'):''));
    }
  });
  function readPicked(){
    var box = $('#impPreview', root); if(!box) return [];
    var out = [];
    $$('tr[data-i]', box).forEach(function(tr){
      var ck = $('.pk', tr); if(ck && !ck.checked) return;
      var r = ui.pending[+tr.dataset.i]; if(!r) return;
      var rec = { name:(r.name||'').trim(), teacher:r.teacher, location:r.location, day:r.day, start:r.start, duration:r.duration, weeks:r.weeks, custom:r.custom, color:'', note:'' };
      if(!rec.name) return;
      out.push(rec);
    });
    return out;
  }
  var f = $('#impFile', root);
  f.addEventListener('change', function(){
    var file = f.files && f.files[0]; if(!file) return;
    loadFile(file);
    f.value = '';
  });
  if(presetFile) loadFile(presetFile);
  else setTimeout(function(){ var t2=$('#impText', root); if(t2) t2.focus(); }, 60);
}

/* ------------------------------ 事件总控 ------------------------------ */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if(!b) return;
  var a = b.dataset.act;
  if(a==='tab'){ setTab(b.dataset.tab); return; }
  if(a==='add'){
    var presetDay = b.dataset.day ? (+b.dataset.day)
      : ((ui.tab==='grid' && gridMode()==='day') ? (ui.day || todayCol()) : dayIndex(new Date()));
    openEditor(null, { day: clamp(presetDay, 1, 7), p: 1 });
    return;
  }
  if(a==='gmode'){ ui.mode = (b.dataset.mode === 'day' ? 'day' : 'week'); renderGrid(); return; }
  if(a==='gday'){ ui.day = clamp(parseInt(b.dataset.day,10)||1, 1, 7); renderGrid(); return; }
  if(a==='term'){ openTermDialog(); return; }
  if(a==='termhint'){ state.settings.termHintClosed = true; save(); renderToday(); return; }
  if(a==='edit'){ var c1 = byId(b.dataset.id); if(c1) openEditor(c1); return; }
  if(a==='dup'){ var c2 = byId(b.dataset.id); if(c2) openDup(c2); return; }
  if(a==='del'){
    var c3 = byId(b.dataset.id);
    if(c3 && confirm('确定删除「'+c3.name+'」？')){
      state.courses = state.courses.filter(function(x){ return x.id!==c3.id; });
      save(); renderAll(); toast('已删除');
    }
    return;
  }
  if(a==='import'){ openImport(); return; }
  if(a==='grid'){ setTab('grid'); return; }
  if(a==='export'){
    download('课表-'+dstr(new Date())+'.json', JSON.stringify(state, null, 2));
    toast('已导出 JSON 备份');
    return;
  }
  if(a==='importfile'){ $('#fileJson') && $('#fileJson').click(); return; }
  if(a==='sample'){
    if(state.courses.length && !confirm('这会追加 11 门示例课程，继续？')) return;
    sampleCourses().forEach(function(c){ state.courses.push(normCourse(c)); });
    save(); renderAll(); toast('已载入示例课表');
    return;
  }
  if(a==='clear'){
    if(!state.courses.length){ toast('当前没有课程'); return; }
    if(confirm('确定清空全部 '+state.courses.length+' 门课程？此操作不可撤销（建议先导出备份）')){
      state.courses = []; save(); renderAll(); toast('已清空');
    }
    return;
  }
  if(a==='qclear'){ ui.query=''; renderList(); return; }
  if(a==='week'){ var w = (ui.week==null?currentWeek():ui.week) + (+b.dataset.delta); ui.week = clamp(w,1,99); renderGrid(); return; }
  if(a==='weeknow'){ ui.week = null; renderGrid(); return; }
  if(a==='weekpick'){
    var v = prompt('跳到第几周？', String(ui.week==null?currentWeek():ui.week));
    if(v!=null && v!==''){ var n = parseInt(v,10); if(n>=1){ ui.week = n; renderGrid(); } }
    return;
  }
  if(a==='cell'){
    openEditor(null, {day:+b.dataset.day, p:+b.dataset.p});
    return;
  }
  if(a==='toggleWeekend'){ state.settings.showWeekend = !state.settings.showWeekend; save(); renderSettings(); toast(state.settings.showWeekend?'已显示周末':'已隐藏周末'); return; }
  if(a==='padd'){
    var last = state.periods[state.periods.length-1] || {s:'08:00',e:'08:45'};
    var s = toMin(last.e) + 10;
    state.periods.push({s:fromMin(s), e:fromMin(s+45)});
    save(); renderSettings(); renderHead(); toast('已添加一节');
    return;
  }
  if(a==='pdel'){
    if(state.periods.length<=1){ toast('至少要保留一节'); return; }
    if(confirm('删除第 '+(+b.dataset.i+1)+' 节？之后的节次会整体前移')){ state.periods.splice(+b.dataset.i,1); save(); renderSettings(); renderHead(); }
    return;
  }
  if(a==='preset'){
    if(confirm('恢复为默认作息时间？')){ state.periods = DEFAULT_PERIODS.map(function(p){ return {s:p.s,e:p.e}; }); save(); renderSettings(); renderHead(); toast('已恢复默认作息'); }
    return;
  }
});

/* ------------------------------ 实时刷新 ------------------------------ */
function tick(){
  var now = new Date(), nm = now.getHours()*60 + now.getMinutes();
  var cl = $('#clock'); if(cl) cl.textContent = pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  /* 倒计时 */
  var cnt = document.querySelector('[data-tick="count"]');
  if(cnt){
    var d = (+cnt.dataset.start) - nm, sec = 59 - now.getSeconds();
    if(d <= 0) cnt.textContent = '就要上课了';
    else cnt.textContent = (d>=60 ? Math.floor(d/60)+' 小时 ' + (d%60) + ' 分' : (d+' 分 ' + pad(sec) + ' 秒'));
  }
  var lf = document.querySelector('[data-tick="left"]');
  if(lf){ var d2 = (+lf.dataset.end) - nm; lf.textContent = d2>0 ? (d2+' 分钟') : '即将下课'; }
}
setInterval(tick, 1000);

/* ------------------------------ 触屏手势 / 自适应 ------------------------------ */
(function(){
  var el = $('#v-grid');
  var x0 = 0, y0 = 0, t0 = 0;
  el.addEventListener('touchstart', function(e){
    if(!e.touches || e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive:true });
  el.addEventListener('touchend', function(e){
    if(gridMode() !== 'day') return;
    var t = e.changedTouches && e.changedTouches[0]; if(!t) return;
    var dx = t.clientX - x0, dy = t.clientY - y0;
    if(Date.now() - t0 > 700 || Math.abs(dx) < 55 || Math.abs(dy) > 60) return;
    var days = state.settings.showWeekend ? 7 : 5;
    var day = (ui.day >= 1 && ui.day <= days) ? ui.day : (dayIndex(new Date()) <= days ? dayIndex(new Date()) : 1);
    var next = day + (dx < 0 ? 1 : -1);
    if(next < 1 || next > days){                       /* 划到边界 → 翻周 */
      ui.week = clamp(((ui.week==null?currentWeek():ui.week) + (dx<0?1:-1)), 1, 99);
      ui.day = (dx < 0) ? 1 : days;
    } else ui.day = next;
    renderGrid(); renderHead();
  }, { passive:true });
})();

  if(qm === 'day' || qm === 'week') ui.mode = qm;
  if(qs.get('term')){                                  /* ?term=2024-09-02 指定开学第一周的周一 */
    var qt = parseDate(qs.get('term'));
    if(!isNaN(qt.getTime())){ state.settings.termStart = dstr(mondayOf(qt)); state.settings.userSetTerm = true; }
  }
  var qv = qs.get('view');
  if(qv && ['today','grid','list','settings'].indexOf(qv) >= 0) bootTab = qv;
}

renderAll();
tick();
setTab(bootTab);

/* 首次访问给出引导 */
try{
  if(!localStorage.getItem(STORE_KEY) && !state.courses.length){
    setTimeout(function(){ toast('新用户提示：去「课程」页点击「导入 / 检索课表」即可批量导入'); }, 900);
  }
}catch(e){}

})();
</script>
</body>
</html>
